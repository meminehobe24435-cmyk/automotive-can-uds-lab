name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up vcan interface
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0

      - name: Run tests on real SocketCAN
        env:
          CAN_INTERFACE: socketcan
          CAN_CHANNEL: vcan0
        run: pytest -v

      - name: Run tests on virtual bus (cross-platform fallback)
        run: CAN_INTERFACE=virtual pytest -q

  demo:
    name: demo run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up vcan
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
      - name: Run end-to-end demo
        env:
          CAN_INTERFACE: socketcan
          CAN_CHANNEL: vcan0
        run: python scripts/smoke.py | tee demo-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: demo-output.txt
