name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GitHub runner 的内核（*-azure）不一定带 vcan 模块。
      # 这里尽力而为：能建起来就跑真实 SocketCAN，建不起来就明确警告，
      # 让标记为 socketcan 的用例自动跳过 —— 不把环境缺失伪装成测试通过，
      # 也不让它把 CI 弄红。
      - name: Set up vcan interface (best effort)
        id: vcan
        run: |
          set +e
          sudo modprobe vcan 2>/dev/null

          if ! sudo ip link add dev vcan0 type vcan 2>/dev/null; then
            echo "vcan module missing, trying linux-modules-extra for $(uname -r)"
            sudo apt-get update -qq 2>/dev/null
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" 2>/dev/null
            sudo modprobe vcan 2>/dev/null
            sudo ip link add dev vcan0 type vcan 2>/dev/null
          fi

          sudo ip link set up vcan0 2>/dev/null

          if ip -details link show vcan0 >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "vcan0 已就绪，将运行真实 SocketCAN 用例"
            ip -details link show vcan0
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=vcan 不可用::内核 $(uname -r) 未提供 vcan 模块，socketcan 标记的用例将跳过"
          fi
          exit 0

      - name: Run tests on real SocketCAN
        if: steps.vcan.outputs.available == 'true'
        env:
          CAN_INTERFACE: socketcan
          CAN_CHANNEL: vcan0
        run: pytest -v

      - name: Run tests on virtual bus
        run: pytest -v

      - name: Summarize fallback
        if: steps.vcan.outputs.available != 'true'
        run: |
          echo "### 本次未运行真实 SocketCAN 用例" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "runner 内核 \`$(uname -r)\` 未提供 vcan 模块，已回退到 python-can 虚拟总线。" >> "$GITHUB_STEP_SUMMARY"
          echo "虚拟总线与真实 CAN 的帧格式和收发语义一致，但不覆盖内核 SocketCAN 路径。" >> "$GITHUB_STEP_SUMMARY"

  socketcan:
    name: socketcan (self-hosted capable)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Try vcan on ubuntu-22.04
        run: |
          set +e
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0
          exit 0
      - name: Run tests
        env:
          CAN_INTERFACE: socketcan
          CAN_CHANNEL: vcan0
        run: pytest -v

  demo:
    name: demo run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run end-to-end demo
        run: python scripts/smoke.py | tee demo-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: demo-output
          path: demo-output.txt
